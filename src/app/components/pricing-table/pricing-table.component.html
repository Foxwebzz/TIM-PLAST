<section class="pricing-table">
  <h2 class="pricing-table__title">{{ title() }}</h2>
  @if (description()) {
    <p class="pricing-table__description">{{ description() }}</p>
  }

  <div class="pricing-table__wrap">
    <table class="pricing-table__table">
      <thead>
        <tr>
          <th>{{ firstColumnLabel() }}</th>
          <th>BEZ UGRADNJE</th>
          <th>SA UGRADNJOM</th>
          <th class="pricing-table__qty-col">KOLIČINA</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.dimensions) {
          <tr
            class="pricing-table__row"
            [class.pricing-table__row--selected]="isSelected(row)"
            (click)="toggle(row)"
          >
            <td class="pricing-table__cell pricing-table__cell--dim" [attr.data-label]="firstColumnLabel()">
              {{ row.dimensions }}
            </td>
            <td class="pricing-table__cell" data-label="Bez ugradnje">
              {{ row.withoutInstallation }}€
            </td>
            <td class="pricing-table__cell" data-label="Sa ugradnjom">
              {{ row.withInstallation }}€
            </td>
            <td class="pricing-table__cell pricing-table__qty-cell" data-label="Količina">
              <div class="pricing-table__stepper" (click)="$event.stopPropagation()">
                <button
                  type="button"
                  class="pricing-table__step-btn"
                  (click)="decrement(row)"
                  [disabled]="quantity(row) === 0"
                  aria-label="Smanji količinu"
                >
                  −
                </button>
                <span class="pricing-table__qty">{{ quantity(row) }}</span>
                <button
                  type="button"
                  class="pricing-table__step-btn"
                  (click)="increment(row)"
                  aria-label="Povećaj količinu"
                >
                  +
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
